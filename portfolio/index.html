    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('portfolio-theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
        }
        document.body.classList.add(theme + '-mode');
      })();
    </script>

    <script>
      (() => {
        const splash = document.getElementById('intro-splash');
        splash.hidden = false;
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const events = ['pointerdown', 'keydown', 'wheel'];
        let dismissed = false;
        const dismiss = () => {
          if (dismissed) return;
          dismissed = true;
          clearTimeout(exitTimer);
          events.forEach((event) => window.removeEventListener(event, dismiss));
          splash.classList.add('intro-loader-exiting');
          setTimeout(() => splash.remove(), reduced ? 0 : 400);
        };
        const exitTimer = setTimeout(dismiss, 600);
        events.forEach((event) =>
          window.addEventListener(event, dismiss, { once: true, passive: true })
        );
      })();
    </script>
